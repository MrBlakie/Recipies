site_name: Blake's Recipes
site_description: Family dinners, favourites and cooking notes.
site_url: https://mrblakie.github.io/Recipies/
exclude_docs: |
  adding-recipes.md
theme:
  name: material
  language: en
  font: false
  palette:
    scheme: slate
    primary: black
    accent: amber
  features:
    - navigation.top
    - search.suggest
plugins:
  - search
  - tags
extra_css:
  - stylesheets/dark-kitchen.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

hooks:
  - hooks/recipe_catalogue.py
not_in_nav: |
  recipes/
